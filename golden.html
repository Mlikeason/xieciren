<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金句 · 管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf8f5;
  --bg-card: #fff;
  --ink: #1a1a1a;
  --ink-soft: #5a5a5a;
  --ink-faint: #999;
  --line: #e6e2db;
  --line-soft: #f0ece5;
  --quote: #2e7a4d;
  --quote-bg: #e8f5ee;
  --quote-bg-hover: #d4edda;
  --active-bg: #f0ece5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans CNS", sans-serif;
  height: 100vh;
  overflow: hidden;
}

/* ─── Top bar ─── */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 24px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  height: 44px;
}
.topbar .title {
  font-family: "Noto Serif TC", serif;
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
}
.topbar .stats { color: var(--ink-soft); white-space: nowrap; }
.topbar .stats strong { color: var(--ink); font-weight: 700; }
.topbar .spacer { flex: 1; }
.topbar .search-box {
  display: flex;
  align-items: center;
  background: var(--bg-card);
  border: 1px solid var(--line);
  padding: 4px 10px;
  gap: 6px;
  width: 200px;
}
.topbar .search-box input {
  border: none; outline: none; background: transparent;
  font-family: inherit; font-size: 12px; width: 100%;
}
.topbar .search-box svg { width: 14px; height: 14px; color: var(--ink-faint); flex-shrink: 0; }
.topbar select {
  border: 1px solid var(--line); background: var(--bg-card);
  padding: 4px 8px; font-family: inherit; font-size: 11px; cursor: pointer; outline: none;
}
.topbar button {
  background: transparent; border: 1px solid var(--ink);
  padding: 4px 14px; cursor: pointer; font-family: inherit;
  font-size: 11px; letter-spacing: 0.06em; white-space: nowrap;
}
.topbar button:hover { background: var(--ink); color: var(--bg); }

/* ─── Main layout ─── */
.main {
  display: grid;
  grid-template-columns: 340px 1fr;
  height: calc(100vh - 44px - 34px);
}

/* ─── Left: song list ─── */
.song-list { border-right: 1px solid var(--line); overflow-y: auto; }
.song-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px; border-bottom: 1px solid var(--line-soft);
  cursor: pointer; transition: background 0.1s;
}
.song-item:hover { background: var(--line-soft); }
.song-item.active { background: var(--active-bg); }
.song-item .info { flex: 1; min-width: 0; }
.song-item .song-name {
  font-family: "Noto Serif TC", serif; font-size: 14px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.song-item .song-meta {
  font-size: 11px; color: var(--ink-faint); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pop-badge {
  font-size: 10px; font-weight: 700; padding: 2px 6px;
  border-radius: 3px; white-space: nowrap; flex-shrink: 0;
}
.pop-100 { background: #fdecea; color: #c0392b; }
.pop-95  { background: #fef3e8; color: #d35400; }
.pop-90  { background: #eef1f1; color: #7f8c8d; }
.quote-count {
  font-size: 10px; color: var(--quote); background: var(--quote-bg);
  padding: 2px 6px; border-radius: 3px; white-space: nowrap; flex-shrink: 0;
}

/* ─── Right: lyrics panel ─── */
.lyrics-panel { display: flex; flex-direction: column; overflow: hidden; }
.lyrics-header {
  padding: 20px 32px 16px;
  border-bottom: 1px solid var(--line-soft);
}
.lyrics-header .lh-title {
  font-family: "Noto Serif TC", serif; font-size: 22px; font-weight: 700; margin-bottom: 4px;
}
.lyrics-header .lh-meta { font-size: 13px; color: var(--ink-soft); }
.lyrics-header .lh-meta b { color: var(--ink); font-weight: 700; }
.lyrics-header .lh-meta .dot { margin: 0 6px; color: var(--ink-faint); }
.lyrics-body { flex: 1; overflow-y: auto; padding: 20px 32px 40px; }

/* ─── Lyric lines ─── */
.lyric-line {
  font-family: "Noto Serif TC", serif; font-size: 17px; line-height: 2.2;
  padding: 2px 12px; cursor: pointer;
  transition: background 0.12s;
  border-left: 3px solid transparent;
  position: relative;
}
.lyric-line:hover { background: var(--line-soft); }

/* Quote group styling */
.lyric-line.quoted {
  background: var(--quote-bg); color: var(--quote); font-weight: 700;
  border-left-color: var(--quote);
}
.lyric-line.quoted:hover { background: var(--quote-bg-hover); }
.lyric-line.q-first { border-radius: 4px 4px 0 0; }
.lyric-line.q-last  { border-radius: 0 0 4px 4px; }
.lyric-line.q-solo  { border-radius: 4px; }
.lyric-line.q-mid   { border-radius: 0; }

/* Edit button on quote groups */
.q-edit-btn {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 26px; height: 26px;
  background: var(--quote);
  color: #fff;
  border: none; border-radius: 4px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.15s;
  font-size: 13px;
  line-height: 1;
}
.lyric-line.quoted:hover .q-edit-btn,
.q-edit-btn:focus { opacity: 1; }

/* ─── Empty state ─── */
.empty-state {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: var(--ink-faint);
  font-family: "Noto Serif TC", serif; font-size: 16px;
}

/* ─── Modal ─── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(26, 26, 26, 0.45);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-card);
  width: 560px;
  max-width: 90vw;
  max-height: 80vh;
  border-radius: 6px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.modal-head {
  padding: 20px 24px 12px;
  border-bottom: 1px solid var(--line-soft);
}
.modal-head .mh-title {
  font-family: "Noto Serif TC", serif;
  font-size: 16px; font-weight: 700; margin-bottom: 4px;
}
.modal-head .mh-sub { font-size: 12px; color: var(--ink-faint); }
.modal-body { padding: 16px 24px; flex: 1; overflow-y: auto; }
.modal-body textarea {
  width: 100%;
  min-height: 100px;
  font-family: "Noto Serif TC", serif;
  font-size: 18px;
  line-height: 2;
  border: 1px solid var(--line);
  padding: 14px 16px;
  resize: vertical;
  outline: none;
  background: var(--bg);
  color: var(--ink);
  border-radius: 4px;
}
.modal-body textarea:focus { border-color: var(--quote); }
.modal-body .hint {
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 8px;
  line-height: 1.6;
}
.modal-body .hint kbd {
  display: inline-block;
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 1px 5px;
  font-family: monospace;
  font-size: 10px;
  border-radius: 3px;
}
.modal-preview {
  margin-top: 16px;
  padding: 16px 20px;
  background: var(--bg);
  border: 1px dashed var(--line);
  border-radius: 4px;
}
.modal-preview .preview-label {
  font-size: 10px;
  color: var(--ink-faint);
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}
.modal-preview .preview-text {
  font-family: "Noto Serif TC", serif;
  font-size: 20px;
  line-height: 1.8;
  font-weight: 700;
  color: var(--ink);
  white-space: pre-wrap;
}
.modal-foot {
  padding: 12px 24px;
  border-top: 1px solid var(--line-soft);
  display: flex; justify-content: flex-end; gap: 10px;
}
.modal-foot button {
  padding: 6px 20px;
  font-family: inherit; font-size: 12px;
  cursor: pointer; border-radius: 3px;
  letter-spacing: 0.04em;
}
.modal-foot .btn-cancel {
  background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
}
.modal-foot .btn-cancel:hover { border-color: var(--ink); color: var(--ink); }
.modal-foot .btn-save {
  background: var(--quote); border: 1px solid var(--quote); color: #fff;
}
.modal-foot .btn-save:hover { background: #256b40; }

/* ─── Help bar ─── */
.helpbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg); border-top: 1px solid var(--line);
  padding: 6px 24px;
  display: flex; gap: 20px;
  font-size: 11px; color: var(--ink-faint); z-index: 10;
  height: 34px; align-items: center;
}
.helpbar .key { display: flex; align-items: center; gap: 5px; }
.helpbar .k {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 20px; padding: 0 5px;
  background: var(--bg-card); border: 1px solid var(--line);
  font-family: monospace; font-size: 10px; font-weight: 700;
}

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }
</style>
</head>
<body>

<header class="topbar">
  <div class="title">金句</div>
  <div class="stats">
    <strong id="totalSongs">0</strong> 首
    <span style="margin:0 4px;color:var(--ink-faint)">·</span>
    <strong id="totalQuotes">0</strong> 句
    <span style="margin:0 4px;color:var(--ink-faint)">·</span>
    已编辑 <strong id="editedCount">0</strong>
  </div>
  <div class="spacer"></div>
  <div class="search-box">
    <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.4"/><line x1="11" y1="11" x2="14" y2="14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <input id="search" type="text" placeholder="搜索歌名 / 歌手 / 词人" autocomplete="off">
  </div>
  <select id="filterLyricist"><option value="">全部词人</option></select>
  <select id="filterPop">
    <option value="">全部分数</option>
    <option value="100">100</option>
    <option value="95">95</option>
    <option value="90">90</option>
  </select>
  <button id="exportBtn">导出 JSON</button>
</header>

<div class="main">
  <div class="song-list" id="songList"></div>
  <div class="lyrics-panel" id="lyricsPanel">
    <div class="empty-state">选择左侧歌曲查看歌词</div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="mh-title" id="modalTitle"></div>
      <div class="mh-sub" id="modalSub"></div>
    </div>
    <div class="modal-body">
      <textarea id="modalText" spellcheck="false"></textarea>
      <div class="hint">
        直接编辑文字：可增删字、调空格。按 <kbd>Enter</kbd> 插入换行，标记海报换行位置。
      </div>
      <div class="modal-preview">
        <div class="preview-label">海报预览</div>
        <div class="preview-text" id="modalPreview"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel" id="modalCancel">取消</button>
      <button class="btn-save" id="modalSave">保存</button>
    </div>
  </div>
</div>

<footer class="helpbar">
  <div class="key"><span class="k">↑↓</span> 切换歌曲</div>
  <div class="key"><span class="k">Click</span> 切换金句</div>
  <div class="key"><span class="k">✎</span> 编辑金句文字</div>
  <div class="key"><span class="k">C</span> 清空本首</div>
</footer>

<script>
const STORAGE_KEY = 'golden_quotes_v2';
let DATA = [];
let filtered = [];
let currentIdx = -1;
let editedSongs = new Set();

// ═══════════════ LOAD ═══════════════
async function loadData() {
  const res = await fetch('data/golden_quotes.json');
  DATA = await res.json();

  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const edits = JSON.parse(saved);
      if (edits.quotes) {
        for (const [id, q] of Object.entries(edits.quotes)) {
          const song = DATA.find(s => String(s.id) === id);
          if (song) { song.quotes = q; editedSongs.add(String(song.id)); }
        }
      }
    } catch {}
  }

  buildLyricistFilter();
  applyFilters();
  updateStats();
}

// ═══════════════ PERSISTENCE ═══════════════
function saveEdits() {
  const edits = { quotes: {} };
  for (const id of editedSongs) {
    const song = DATA.find(s => String(s.id) === id);
    if (song) edits.quotes[id] = song.quotes;
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(edits));
}

// ═══════════════ QUOTE HELPERS ═══════════════
function getQuotedLines(song) {
  const set = new Set();
  for (const q of song.quotes) for (const l of q.lines) set.add(l);
  return set;
}

function findQuoteGroup(song, lineIdx) {
  return song.quotes.findIndex(q => q.lines.includes(lineIdx));
}

function rebuildQuotes(song) {
  const quoted = getQuotedLines(song);
  const sorted = [...quoted].sort((a, b) => a - b);

  const groups = [];
  let cur = null;
  for (const idx of sorted) {
    if (cur && idx === cur[cur.length - 1] + 1) {
      cur.push(idx);
    } else {
      if (cur) groups.push(cur);
      cur = [idx];
    }
  }
  if (cur) groups.push(cur);

  song.quotes = groups.map(lines => {
    const existing = song.quotes.find(q =>
      q.lines.length === lines.length && q.lines.every((l, i) => l === lines[i])
    );
    if (existing) return existing;
    return { lines, text: lines.map(i => song.lyrics[i]).join('\n') };
  });
}

function toggleLine(song, lineIdx) {
  const quoted = getQuotedLines(song);
  if (quoted.has(lineIdx)) {
    quoted.delete(lineIdx);
  } else {
    quoted.add(lineIdx);
  }

  const sorted = [...quoted].sort((a, b) => a - b);
  const groups = [];
  let cur = null;
  for (const idx of sorted) {
    if (cur && idx === cur[cur.length - 1] + 1) {
      cur.push(idx);
    } else {
      if (cur) groups.push(cur);
      cur = [idx];
    }
  }
  if (cur) groups.push(cur);

  song.quotes = groups.map(lines => {
    const existing = song.quotes.find(q =>
      q.lines.length === lines.length && q.lines.every((l, i) => l === lines[i])
    );
    if (existing) return existing;
    return { lines, text: lines.map(i => song.lyrics[i]).join('\n') };
  });

  editedSongs.add(String(song.id));
  saveEdits();
  updateStats();
}

// ═══════════════ FILTERS ═══════════════
function buildLyricistFilter() {
  const counts = {};
  DATA.forEach(s => { const l = s.lyricist || '未知'; counts[l] = (counts[l] || 0) + 1; });
  const sel = document.getElementById('filterLyricist');
  Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([name, cnt]) => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = `${name} (${cnt})`;
    sel.appendChild(opt);
  });
}

function applyFilters() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const lyricist = document.getElementById('filterLyricist').value;
  const pop = document.getElementById('filterPop').value;

  filtered = DATA.filter(s => {
    if (lyricist && s.lyricist !== lyricist) return false;
    if (pop && s.popularity !== Number(pop)) return false;
    if (q && !(s.title + ' ' + s.artist + ' ' + s.lyricist).toLowerCase().includes(q)) return false;
    return true;
  });

  renderList();
  if (filtered.length > 0) {
    if (currentIdx < 0 || currentIdx >= filtered.length) selectSong(0);
    else selectSong(currentIdx);
  } else {
    currentIdx = -1;
    document.getElementById('lyricsPanel').innerHTML = '<div class="empty-state">无匹配结果</div>';
  }
}

// ═══════════════ RENDER LIST ═══════════════
function renderList() {
  const el = document.getElementById('songList');
  el.innerHTML = '';
  filtered.forEach((song, idx) => {
    const div = document.createElement('div');
    div.className = 'song-item' + (idx === currentIdx ? ' active' : '');
    const popCls = song.popularity >= 100 ? 'pop-100' : song.popularity >= 95 ? 'pop-95' : 'pop-90';
    const qc = song.quotes.length;
    div.innerHTML = `
      <div class="info">
        <div class="song-name">${esc(song.title)}</div>
        <div class="song-meta">${esc(song.artist)} · 词 ${esc(song.lyricist)} · ${song.year || '?'}</div>
      </div>
      ${qc > 0 ? `<span class="quote-count">${qc}</span>` : ''}
      <span class="pop-badge ${popCls}">${song.popularity}</span>
    `;
    div.addEventListener('click', () => selectSong(idx));
    el.appendChild(div);
  });
}

// ═══════════════ SELECT SONG ═══════════════
function selectSong(idx) {
  if (idx < 0 || idx >= filtered.length) return;
  currentIdx = idx;
  document.querySelectorAll('.song-item').forEach((el, i) => el.classList.toggle('active', i === idx));
  const activeEl = document.querySelector('.song-item.active');
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'instant' });
  renderLyrics(filtered[idx]);
}

// ═══════════════ RENDER LYRICS ═══════════════
function renderLyrics(song) {
  const panel = document.getElementById('lyricsPanel');
  if (!song) { panel.innerHTML = '<div class="empty-state">无匹配结果</div>'; return; }

  panel.innerHTML = `
    <div class="lyrics-header">
      <div class="lh-title">${esc(song.title)}</div>
      <div class="lh-meta">
        <b>${esc(song.artist)}</b><span class="dot">·</span>
        词 <b>${esc(song.lyricist)}</b><span class="dot">·</span>
        ${song.year || '?'}<span class="dot">·</span>
        热度 <b>${song.popularity}</b>
      </div>
    </div>
    <div class="lyrics-body" id="lyricsBody"></div>
  `;

  renderLyricLines(song);
}

function renderLyricLines(song) {
  const body = document.getElementById('lyricsBody');
  body.innerHTML = '';

  const quotedLines = getQuotedLines(song);
  const lineToGroup = {};
  song.quotes.forEach((q, gi) => q.lines.forEach(l => { lineToGroup[l] = gi; }));

  song.lyrics.forEach((line, i) => {
    const div = document.createElement('div');
    div.className = 'lyric-line';
    div.textContent = line;
    div.dataset.lineIdx = i;

    if (quotedLines.has(i)) {
      div.classList.add('quoted');
      const grp = song.quotes[lineToGroup[i]];
      const pos = grp.lines.indexOf(i);
      const len = grp.lines.length;

      if (len === 1) {
        div.classList.add('q-solo');
      } else if (pos === 0) {
        div.classList.add('q-first');
      } else if (pos === len - 1) {
        div.classList.add('q-last');
      } else {
        div.classList.add('q-mid');
      }

      if (pos === len - 1 || len === 1) {
        const btn = document.createElement('button');
        btn.className = 'q-edit-btn';
        btn.innerHTML = '✎';
        btn.title = '编辑金句';
        btn.addEventListener('click', e => {
          e.stopPropagation();
          openModal(song, lineToGroup[i]);
        });
        div.appendChild(btn);
      }
    }

    div.addEventListener('click', () => {
      toggleLine(song, i);
      renderLyricLines(song);
      updateListQuoteCount(currentIdx, song);
    });

    body.appendChild(div);
  });
}

function updateListQuoteCount(idx, song) {
  const items = document.querySelectorAll('.song-item');
  if (!items[idx]) return;
  const qcEl = items[idx].querySelector('.quote-count');
  const qc = song.quotes.length;
  if (qcEl) {
    if (qc > 0) qcEl.textContent = qc;
    else qcEl.remove();
  } else if (qc > 0) {
    const span = document.createElement('span');
    span.className = 'quote-count';
    span.textContent = qc;
    items[idx].querySelector('.info').after(span);
  }
}

// ═══════════════ MODAL ═══════════════
let modalSong = null;
let modalGroupIdx = -1;

function openModal(song, groupIdx) {
  modalSong = song;
  modalGroupIdx = groupIdx;
  const q = song.quotes[groupIdx];

  document.getElementById('modalTitle').textContent = song.title;
  document.getElementById('modalSub').textContent =
    `${song.artist} · 词 ${song.lyricist} · 第 ${q.lines.map(l => l + 1).join('-')} 行`;

  const textarea = document.getElementById('modalText');
  textarea.value = q.text;
  document.getElementById('modalPreview').textContent = q.text;
  document.getElementById('modalOverlay').classList.add('open');
  textarea.focus();
  textarea.select();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  modalSong = null;
  modalGroupIdx = -1;
}

function saveModal() {
  if (!modalSong || modalGroupIdx < 0) return;
  const text = document.getElementById('modalText').value;
  modalSong.quotes[modalGroupIdx].text = text;
  editedSongs.add(String(modalSong.id));
  saveEdits();
  closeModal();
}

document.getElementById('modalText').addEventListener('input', e => {
  document.getElementById('modalPreview').textContent = e.target.value;
});
document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('modalSave').addEventListener('click', saveModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// ═══════════════ STATS ═══════════════
function updateStats() {
  document.getElementById('totalSongs').textContent = DATA.length;
  document.getElementById('totalQuotes').textContent = DATA.reduce((s, d) => s + d.quotes.length, 0);
  document.getElementById('editedCount').textContent = editedSongs.size;
}

// ═══════════════ EXPORT ═══════════════
function exportJSON() {
  const out = DATA.map(s => ({
    id: s.id, title: s.title, artist: s.artist,
    lyricist: s.lyricist, year: s.year, popularity: s.popularity,
    lyrics: s.lyrics, quotes: s.quotes,
  }));
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'golden_quotes.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ═══════════════ KEYBOARD ═══════════════
document.addEventListener('keydown', e => {
  // Modal open: handle Escape and Cmd+Enter
  if (document.getElementById('modalOverlay').classList.contains('open')) {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveModal(); }
    return;
  }

  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (currentIdx < filtered.length - 1) selectSong(currentIdx + 1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (currentIdx > 0) selectSong(currentIdx - 1);
  } else if (e.key === 'c' || e.key === 'C') {
    if (currentIdx >= 0 && filtered[currentIdx]) {
      const song = filtered[currentIdx];
      song.quotes = [];
      editedSongs.add(String(song.id));
      saveEdits();
      renderLyricLines(song);
      updateStats();
      updateListQuoteCount(currentIdx, song);
    }
  }
});

// ═══════════════ EVENTS ═══════════════
document.getElementById('search').addEventListener('input', debounce(applyFilters, 200));
document.getElementById('filterLyricist').addEventListener('change', applyFilters);
document.getElementById('filterPop').addEventListener('change', applyFilters);
document.getElementById('exportBtn').addEventListener('click', exportJSON);

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

loadData();
</script>
</body>
</html>
